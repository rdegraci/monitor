[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor_rdegraci2025"
version = "1.0.0"
description = "A modular LLM Command-line Assistant"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Rodney Degracia", email = "rdegraci@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "appdirs==1.4.4",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "colored==2.3.0",
    "litellm==1.73.0",
    "prompt_toolkit==3.0.51",
    "pygments==2.19.1",
    "mcp==1.9.0",
    "tavily-python==0.7.2",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "redis==6.1.0",
    "openai-whisper",
    "pyaudio==0.2.14",
    "graphviz==0.20.3",
    "ollama==0.4.8",
    "duckdb==1.2.2",
    "GitPython==3.1.44",
    "tiktoken==0.9.0",
    "anthropic==0.54.0",
    "flask==3.1.1",
    "coqui-tts==0.27.0",
    "openai==1.101.0",
    "requests==2.32.3",
    "joblib==1.4.2",
    # Platform-specific libmagic bindings to enable seamless file type detection:
    # - python-magic for non-Windows platforms
    # - python-magic-bin for Windows platforms
    "python-magic; sys_platform != 'win32'",
    "python-magic-bin; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://github.com/rdegraci/monitor"
Issues = "https://github.com/rdegraci/monitor/issues"

[project.scripts]
monitor = "monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monitor = [
    "config.yaml",
    "dot_env_example",
    "preferences.prompt",
    "non_interactive_commands.json",
    "interactive_commands.json",
    "macros.json",
    "model_config.json",
    "directives/echo.prompt",
    "directives/greet.prompt"
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests/core", "tests/lib"]
pythonpath = ["src"]
