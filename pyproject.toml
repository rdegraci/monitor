[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor_rdegraci2025"
version = "1.0.0"
description = "A modular LLM Command-line Assistant"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Rodney Degracia", email = "rdegraci@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "appdirs==1.4.4",
    "pyyaml==6.0.2",
    "python-dotenv==1.2.2",
    "colored==2.3.0",
    "litellm==1.85.0",
    "rich==13.9.4",
    "prompt_toolkit==3.0.51",
    "pygments==2.19.1",
    "mcp==1.9.0",
    "redis==6.1.0",
    "ollama==0.4.8",
    "GitPython==3.1.44",
    "tiktoken==0.12.0",
    "anthropic==0.54.0",
    "openai==2.24.0",
    "requests==2.31.0",
    "mypy==2.1.0",
    "pyperclip==1.11.0",
    # Platform-specific libmagic bindings to enable seamless file type detection:
    # - python-magic for non-Windows platforms
    # - python-magic-bin for Windows platforms
    "python-magic; sys_platform != 'win32'",
    "python-magic-bin; sys_platform == 'win32'"
]

[project.optional-dependencies]
voice = [
    "openai-whisper",
    "pyaudio==0.2.14",
]
tts = [
    "coqui-tts==0.27.0",
]
chroma = [
    "chromadb==1.0.10",
]
science = [
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
    "graphviz==0.20.3",
]
database = [
    "duckdb==1.2.2",
]
network = [
    "tavily-python==0.7.2",
]
server = [
    "flask==3.1.1",
]
aws = [
    "boto3==1.43.20",
]
all = [
    "openai-whisper",
    "pyaudio==0.2.14",
    "coqui-tts==0.27.0",
    "chromadb==1.0.10",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
    "graphviz==0.20.3",
    "duckdb==1.2.2",
    "tavily-python==0.7.2",
    "flask==3.1.1",
    "boto3==1.43.20",
]

[project.urls]
Homepage = "https://github.com/rdegraci/monitor"
Issues = "https://github.com/rdegraci/monitor/issues"

[project.scripts]
monitor = "monitor.__main__:main"
monitor-oop = "monitor_oop.__main__:main"
chroma-db = "monitor.lib.chroma_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monitor = [
    "config.yaml.example",
    "dot_env_example",
    "preferences.prompt",
    "non_interactive_commands.json",
    "interactive_commands.json",
    "macros.json",
    "model_config.json",
    "directives/echo.prompt",
    "directives/greet.prompt"
]

[tool.pytest.ini_options]
testpaths = ["tests/monitor", "tests/monitor_oop", "tests/benchmark"]
pythonpath = ["src"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
